name: Bug report
description: Report reproducible unexpected behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve Gemi Dompet. Do not include credentials or personal financial data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See error ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, and app version or commit.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Redact personal, financial, and secret data before uploading.
